<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rejuvenate is coming soon to Sports City, Dubai. Follow us for the reveal."
    />
    <title>Rejuvenate | Coming Soon</title>
    <meta name="theme-color" content="#3A1B14" />

    <!-- Favicon (circle logo, transparent — not a white square) -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/apple-touch-icon.png"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rejuvenate.buildyourweb.ae/" />
    <meta property="og:title" content="Rejuvenate | Coming Soon" />
    <meta
      property="og:description"
      content="Rejuvenate is coming soon to Sports City, Dubai. Something beautiful is taking shape—follow us for the reveal."
    />
    <meta
      property="og:image"
      content="https://rejuvenate.buildyourweb.ae/assets/og-image.jpg"
    />
    <meta
      property="og:image:secure_url"
      content="https://rejuvenate.buildyourweb.ae/assets/og-image.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Rejuvenate" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://rejuvenate.buildyourweb.ae/" />
    <meta name="twitter:title" content="Rejuvenate | Coming Soon" />
    <meta
      name="twitter:description"
      content="Rejuvenate is coming soon to Sports City, Dubai. Something beautiful is taking shape—follow us for the reveal."
    />
    <meta
      name="twitter:image"
      content="https://rejuvenate.buildyourweb.ae/assets/og-image.jpg"
    />
    <meta
      name="twitter:img:src"
      content="https://rejuvenate.buildyourweb.ae/assets/og-image.jpg"
    />

    <meta name="author" content="Rejuvenate" />
    <meta
      name="keywords"
      content="Rejuvenate, Dubai, Sports City, coming soon"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&family=Montserrat:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>

    <a href="/" class="corner-logo" aria-label="Rejuvenate home">
      <img
        src="assets/logo/r_logo_transparent.png"
        alt="R"
        width="48"
        height="48"
      />
    </a>

    <main class="page">
      <div class="content">
        <img
          class="logo"
          src="assets/logo/rejuvenate_logo_transparent.png"
          alt="Rejuvenate"
          width="320"
          height="160"
        />

        <h1 class="headline">Coming Soon</h1>

        <p class="subtitle">
          Something beautiful is taking shape. Follow us for the reveal.
        </p>

        <p class="location">Sports City, Dubai</p>

        <nav class="cta" aria-label="Contact">
          <!-- Update href values with your Instagram profile and WhatsApp number -->
          <a
            class="cta-link"
            href="https://www.instagram.com/rejuvenate_dxb/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Follow us on Instagram"
          >
            <svg
              class="cta-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.25"
              aria-hidden="true"
            >
              <rect x="3" y="3" width="18" height="18" rx="5" />
              <circle cx="12" cy="12" r="4" />
              <circle cx="17.2" cy="6.8" r="0.6" fill="currentColor" stroke="none" />
            </svg>
            <span>Instagram</span>
          </a>
          <a
            class="cta-link"
            href="https://wa.me/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Message us on WhatsApp"
          >
            <svg
              class="cta-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.25"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"/>
              <path d="M9 10.5c.5 1 1.5 2.5 3 3.5 1 .7 2 1 2.5 1 .3 0 .5-.1.7-.3l.8-.8a.5.5 0 0 0 0-.7l-1.3-1.3a.5.5 0 0 0-.7 0l-.4.4a4.5 4.5 0 0 1-2.4-2.4l.4-.4a.5.5 0 0 0 0-.7L10.3 8a.5.5 0 0 0-.7 0l-.8.8c-.2.2-.3.4-.3.7.1.4.3.7.5 1z"/>
            </svg>
            <span>WhatsApp</span>
          </a>
        </nav>
      </div>
    </main>
  </body>
</html>
